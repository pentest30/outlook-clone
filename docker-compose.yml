# Local test mail server. Accepts any username/password and creates the mailbox on first login.
services:
  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
